# Ships every Docker container's stdout/stderr to Loki. Container name lands
# as a label so you can filter in Grafana with `{container="bliq-backend-1"}`.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Container name → 'container' label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Compose service name → 'service' label
      - source_labels:
          ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
