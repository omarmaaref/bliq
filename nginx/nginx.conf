# nginx reverse proxy fronting two backend replicas.
#
# All traffic — HTTP endpoints and socket.io (WebSocket + handshake) — is
# round-robin load-balanced across the same upstream pool. No sticky sessions.

worker_processes auto;
events { worker_connections 1024; }

http {
  log_format lb '$remote_addr - $request '
                'status=$status upstream=$upstream_addr '
                'req=$request_time upstream_time=$upstream_response_time';
  access_log /var/log/nginx/access.log lb;

  upstream backend_pool {
    server backend-1:3000 max_fails=3 fail_timeout=15s;
    server backend-2:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  # Allow the WebSocket upgrade headers to flow through.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # socket.io traffic — WebSocket upgrade allowed, same round-robin pool.
    location /socket.io/ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Everything else — HTTP API, Swagger UI, /health, /metrics if enabled.
    location / {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
